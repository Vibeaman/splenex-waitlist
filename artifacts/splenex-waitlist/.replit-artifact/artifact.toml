kind = "web"
previewPath = "/"
title = "Splenex Waitlist"
description = "A polished, task-gated waitlist for Splenex that guides visitors through joining the X and Telegram communities before collecting their email and X username, with an admin view for submissions."
version = "1.0.0"
id = "artifacts/splenex-waitlist"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19918

[services.development]
run = "pnpm --filter @workspace/splenex-waitlist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/splenex-waitlist", "run", "build" ]
serve = "static"
publicDir = "artifacts/splenex-waitlist/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19918"
BASE_PATH = "/"
